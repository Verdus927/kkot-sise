name: 시세 파일 미리 만들기
# 경매 시세가 올라오는 아침(한국 시간 6시~11시)에는 15분마다, 그 밖에는 1시간마다
# 시세 서버에서 첫 화면 시세를 받아 data/snapshot.json 으로 저장합니다. (돈 드는 작업 아님)
on:
  schedule:
    - cron: '*/15 21-23 * * *'   # 한국 06:00~08:59
    - cron: '*/15 0-1 * * *'     # 한국 09:00~10:59
    - cron: '7 2-20 * * *'       # 한국 11시~05시, 1시간마다
  workflow_dispatch:
concurrency:
  group: snapshot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 시세 받기
        run: python3 tools/snapshot.py
      - name: 바뀌었으면 올리기
        run: |
          git config user.name "Verdus927"
          git config user.email "272083087+Verdus927@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/snapshot.json)" ]; then echo "바뀐 것 없음"; exit 0; fi
          git add data/snapshot.json
          git commit -m "시세 파일 갱신"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i*5))
          done
          exit 1
