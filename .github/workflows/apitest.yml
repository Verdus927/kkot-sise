name: api-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: page
        run: |
          npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'J'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const pg=await b.newPage();
          await pg.addInitScript(()=>localStorage.setItem('yangjaeFav2',JSON.stringify(['장미␟골든부부젤라(sp)','장미␟*'])));
          pg.on('request',r=>{if(r.url().includes('getPriceIndex'))console.log('REQ len',r.url().length)});
          await pg.goto('https://verdus927.github.io/kkot-sise/');await pg.waitForTimeout(15000);
          console.log(await pg.evaluate(()=>JSON.stringify({idx:!!IDX,err:IDX_ERROR,n:IDX&&Object.keys(IDX.rows).length,has:IDX&&!!IDX.rows['장미␟골든부부젤라(sp)'],keys:indexRequestKeys().length,fav:[...FAV],favtxt:document.getElementById('extraFavorites').innerText.slice(0,200)})));
          await b.close()})();
          J
          node t.js
