name: 꽃 그림 자동 제작

on:
  schedule:
    - cron: '0 16 * * *'   # 매일 한국 시간 새벽 1시
  workflow_dispatch:
    inputs:
      per_run: { description: '이번에 만들 장수', default: '10' }
      only: { description: '이 꽃만 (쉼표로 구분, 비우면 순서대로)', default: '' }
  push:
    paths: ['tools/run-now.txt']   # 이 파일을 고쳐 올리면 바로 한 번 실행

permissions:
  contents: write

concurrency: { group: flowers, cancel-in-progress: false }

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy scipy
      - name: 그림 만들기
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PER_RUN: ${{ github.event.inputs.per_run || (github.event_name == 'push' && '3') || '10' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then export ONLY="$(grep -v '^#' tools/run-now.txt | tr -d '\n' | xargs)"; fi
          python tools/gen_flowers.py
      - name: 결과 올리기
        run: |
          git config user.name "kkot-sise-bot"
          git config user.email "272083087+Verdus927@users.noreply.github.com"
          for f in img/flowers tools/state.json tools/last_run.log preview/index.html review; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && echo "바뀐 것 없음" && exit 0
          git commit -m "꽃 그림 자동 제작 $(date +%F)"
          git pull --rebase && git push
